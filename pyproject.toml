[project]
name = "regresslab"
version = "0.1.0"
description = "Detect performance regressions in software systems."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "benchmark",
    "performance",
    "regression",
    "ci",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy",
    "pytest>=8.3.5",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I",  # import sorting
    "UP", # modern Python syntax
    "B",  # common bug patterns
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/regresslab"]
